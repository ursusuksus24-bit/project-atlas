
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0a20">
    <meta name="description" content="Project Atlas — интерактивная карта реального мира.">
    <title>Project Atlas</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0a20;
            font-family: Arial, sans-serif;
        }

        #map {
            position: absolute;
            inset: 0;
            background: #0b0a20;
        }

        .top-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .logo {
            color: #f5efff;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 14px rgba(255, 70, 160, .5);
        }

        .subtitle {
            margin-top: 5px;
            color: #55e6e8;
            font-size: 10px;
            letter-spacing: 3px;
        }

        .gps-button {
            position: absolute;
            right: 20px;
            bottom: 105px;
            z-index: 10;
            padding: 14px 20px;
            border: 1px solid #ff69bd;
            border-radius: 6px;
            background: rgba(12, 10, 29, .96);
            color: #ff9bd7;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 70, 160, .2);
        }

        .gps-button:active {
            background: #35203f;
        }

        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            min-height: 75px;
            padding: 15px 20px;
            z-index: 10;
            background: rgba(10, 9, 27, .97);
            border-top: 1px solid rgba(255, 90, 180, .5);
            color: white;
        }

        .bottom-title {
            margin-bottom: 7px;
            color: #ff80c9;
            font-size: 10px;
            letter-spacing: 3px;
        }

        .bottom-info {
            color: #d2c9e7;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .user-arrow {
            width: 48px;
            height: 58px;
            filter:
                drop-shadow(0 0 2px #080b18)
                drop-shadow(0 0 5px #ffffff)
                drop-shadow(0 0 10px rgba(70, 235, 235, .8));
        }

        /* Круглые маркеры Project Atlas */
        .poi-marker {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            background: rgba(20, 15, 39, .96);
            border: 1.5px solid var(--poi-color);
            box-shadow:
                0 0 5px var(--poi-color),
                0 0 12px color-mix(in srgb, var(--poi-color) 45%, transparent),
                inset 0 0 8px rgba(255,255,255,.05);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .poi-marker:hover {
            transform: scale(1.18);
            box-shadow:
                0 0 8px var(--poi-color),
                0 0 18px var(--poi-color);
        }

        .poi-marker svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: var(--poi-color);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Маленькая подпись после нажатия */
        .atlas-popup .maplibregl-popup-content {
            padding: 10px 14px;
            border: 1px solid rgba(255, 105, 189, .65);
            border-radius: 7px;
            background: #171229;
            color: #f5efff;
            box-shadow: 0 0 16px rgba(255, 70, 160, .22);
            font-family: Arial, sans-serif;
        }

        .atlas-popup .maplibregl-popup-tip {
            border-top-color: #171229;
            border-bottom-color: #171229;
        }

        .popup-name {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: .5px;
        }

        .popup-type {
            margin-top: 4px;
            color: #55e6e8;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .maplibregl-ctrl-attrib {
            font-size: 10px !important;
        }

        @media (max-width: 600px) {
            .top-panel {
                top: 16px;
                left: 15px;
            }

            .logo { font-size: 19px; }

            .gps-button {
                right: 15px;
                bottom: 100px;
            }

            .poi-marker {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="top-panel">
        <div class="logo">PROJECT ATLAS</div>
        <div class="subtitle">VICE CITY / NIGHTCALL</div>
    </div>

    <button class="gps-button" onclick="findMe()">
        ◉ НАЙТИ МЕНЯ
    </button>

    <div class="bottom-panel">
        <div class="bottom-title">GPS SYSTEM</div>
        <div class="bottom-info" id="status">LOCATION: TASHKENT</div>
        <div class="bottom-info" id="coordinates">COORDINATES: WAITING...</div>
    </div>

    <script>
        // Создание карты
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/dark',
            center: [69.585, 41.465],
            zoom: 9.2,
            attributionControl: true,
            pitchWithRotate: false,
            dragRotate: false
        });

        // Палитра Vice City / Project Atlas
        function applyAtlasStyle() {
            const layers = map.getStyle().layers || [];

            layers.forEach(layer => {
                const id = layer.id.toLowerCase();
                const sourceLayer =
                    (layer['source-layer'] || '').toLowerCase();

                try {
                    // Фон
                    if (layer.type === 'background') {
                        map.setPaintProperty(
                            layer.id,
                            'background-color',
                            '#100d25'
                        );
                    }

                    // Вода
                    if (
                        layer.type === 'fill' &&
                        (sourceLayer === 'water' || id.includes('water'))
                    ) {
                        map.setPaintProperty(
                            layer.id,
                            'fill-color',
                            '#111936'
                        );
                    }

                    // Зелёные зоны и парки
                    if (
                        layer.type === 'fill' &&
                        ['park', 'landcover', 'landuse'].includes(sourceLayer)
                    ) {
                        map.setPaintProperty(
                            layer.id,
                            'fill-color',
                            '#17152d'
                        );
                    }

                    // Здания и кварталы
                    if (
                        layer.type === 'fill' &&
                        (
                            sourceLayer === 'building' ||
                            id.includes('building')
                        )
                    ) {
                        map.setPaintProperty(
                            layer.id,
                            'fill-color',
                            '#211832'
                        );

                        map.setPaintProperty(
                            layer.id,
                            'fill-outline-color',
                            '#493052'
                        );
                    }

                    // Дорожная сеть
                    if (
                        layer.type === 'line' &&
                        sourceLayer === 'transportation'
                    ) {
                        const isCasing = id.includes('casing');

                        const roadColors = [
                            'match',
                            ['get', 'class'],
                            'motorway', '#ff55b5',
                            'trunk', '#f65aaf',
                            'primary', '#ed4da7',
                            'secondary', '#d85ba9',
                            'tertiary', '#48bfc9',
                            'minor', '#348d9f',
                            'service', '#376a86',
                            'path', '#354d75',
                            'track', '#354d75',
                            '#47718d'
                        ];

                        const casingColors = [
                            'match',
                            ['get', 'class'],
                            'motorway', '#64234f',
                            'trunk', '#572449',
                            'primary', '#512044',
                            'secondary', '#462044',
                            'tertiary', '#193d50',
                            '#192b47'
                        ];

                        map.setPaintProperty(
                            layer.id,
                            'line-color',
                            isCasing ? casingColors : roadColors
                        );

                        if (!isCasing) {
                            map.setPaintProperty(
                                layer.id,
                                'line-blur',
                                [
                                    'interpolate',
                                    ['linear'],
                                    ['zoom'],
                                    10, 0,
                                    15, 0.8,
                                    18, 1.2
                                ]
                            );
                        }
                    }

                    // Названия улиц и объектов
                    if (layer.type === 'symbol') {
                        if (
                            map.getPaintProperty(layer.id, 'text-color') !== undefined
                        ) {
                            map.setPaintProperty(
                                layer.id,
                                'text-color',
                                '#d8c9ed'
                            );
                        }

                        if (
                            map.getPaintProperty(layer.id, 'text-halo-color') !== undefined
                        ) {
                            map.setPaintProperty(
                                layer.id,
                                'text-halo-color',
                                '#100d25'
                            );
                        }

                        if (
                            map.getPaintProperty(layer.id, 'text-halo-width') !== undefined
                        ) {
                            map.setPaintProperty(
                                layer.id,
                                'text-halo-width',
                                1.3
                            );
                        }
                    }
                } catch (error) {
                    console.warn('Style layer skipped:', layer.id, error);
                }
            });
        }

        // Первые реальные точки интереса
        const pointsOfInterest = [
            {
                name: 'Cafe Dosan',
                type: 'Кафе',
                category: 'cafe',
                coordinates: [69.270664, 41.303869]
            },
            {
                name: 'Tashkent City Mall',
                type: 'Торговый центр',
                category: 'shop',
                coordinates: [69.25244, 41.31629]
            },
            {
                name: 'Площадь Амира Темура',
                type: 'Достопримечательность',
                category: 'landmark',
                coordinates: [69.27966, 41.31143]
            },
            {
                name: 'Комплекс Хазрати Имам',
                type: 'Историческое место',
                category: 'landmark',
                coordinates: [69.24008, 41.33731]
            },
            {
                name: 'Чарвакское водохранилище',
                type: 'Природная достопримечательность',
                category: 'nature',
                coordinates: [70.03139, 41.63667]
            },
            {
                name: 'Курорт Амирсой',
                type: 'Горный курорт',
                category: 'mountain',
                coordinates: [69.94234, 41.48671]
            }
        ];

        // SVG-значки
        const poiIcons = {
            cafe: `
                <svg viewBox="0 0 24 24">
                    <path d="M4 8h13v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/>
                    <path d="M17 10h2a2 2 0 0 1 0 4h-2"/>
                    <path d="M8 4v2M12 3v3M16 4v2"/>
                </svg>
            `,
            shop: `
                <svg viewBox="0 0 24 24">
                    <path d="M5 8h14l1 12H4L5 8z"/>
                    <path d="M9 9V6a3 3 0 0 1 6 0v3"/>
                    <path d="M9 14h6"/>
                </svg>
            `,
            landmark: `
                <svg viewBox="0 0 24 24">
                    <path d="M3 20h18M5 17h14M6 17V9h12v8"/>
                    <path d="M4 9l8-5 8 5z"/>
                    <path d="M9 11v4M12 11v4M15 11v4"/>
                </svg>
            `,
            nature: `
                <svg viewBox="0 0 24 24">
                    <path d="M3 9c3-3 6 3 9 0s6-3 9 0"/>
                    <path d="M3 14c3-3 6 3 9 0s6-3 9 0"/>
                    <path d="M3 19c3-3 6 3 9 0s6-3 9 0"/>
                </svg>
            `,
            mountain: `
                <svg viewBox="0 0 24 24">
                    <path d="M2 20l7-12 4 6 3-4 6 10z"/>
                    <path d="M7 12l2 2 2-1M14 12l2 2 2-1"/>
                </svg>
            `
        };

        const poiColors = {
            cafe: '#65e8e8',
            shop: '#ff79c6',
            landmark: '#c49aff',
            nature: '#75e6bb',
            mountain: '#75cfff'
        };

        // Добавление маркеров на карту
        function addPoiMarkers() {
            pointsOfInterest.forEach(point => {
                const element = document.createElement('div');

                element.className = 'poi-marker';
                element.style.setProperty(
                    '--poi-color',
                    poiColors[point.category]
                );

                element.innerHTML = poiIcons[point.category];
                element.title = point.name;
                element.setAttribute('role', 'button');
                element.setAttribute('aria-label', point.name);
                element.setAttribute('tabindex', '0');

                const popup = new maplibregl.Popup({
                    offset: 22,
                    closeButton: false,
                    closeOnClick: true,
                    className: 'atlas-popup'
                }).setHTML(`
                    <div class="popup-name">${point.name}</div>
                    <div class="popup-type">${point.type}</div>
                `);

                element.addEventListener('click', event => {
                    event.stopPropagation();

                    popup
                        .setLngLat(point.coordinates)
                        .addTo(map);
                });

                element.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        popup
                            .setLngLat(point.coordinates)
                            .addTo(map);
                    }
                });

                new maplibregl.Marker({
                    element: element,
                    anchor: 'center'
                })
                    .setLngLat(point.coordinates)
                    .addTo(map);
            });
        }

        map.on('load', function() {
            applyAtlasStyle();
            addPoiMarkers();
        });

        // Стрелка GPS
        const arrowHTML = `
            <svg class="user-arrow" viewBox="0 0 48 58"
                 xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="arrowTop" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="45%" stop-color="#8cfff5"/>
                        <stop offset="100%" stop-color="#28cbd2"/>
                    </linearGradient>

                    <linearGradient id="arrowSide" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#172536"/>
                        <stop offset="100%" stop-color="#526477"/>
                    </linearGradient>
                </defs>

                <path d="M24 3 L44 27 L24 55 L4 27 Z"
                      fill="#101827"
                      stroke="#ffffff"
                      stroke-width="2"/>

                <path d="M24 3 L24 55 L4 27 Z"
                      fill="url(#arrowSide)"/>

                <path d="M24 3 L42 26 L24 43 L6 26 Z"
                      fill="url(#arrowTop)"
                      stroke="#ffffff"
                      stroke-width="1.2"/>

                <path d="M18 49 L24 55 L30 49"
                      fill="none"
                      stroke="#ff62b9"
                      stroke-width="2.5"
                      stroke-linecap="round"/>
            </svg>
        `;

        const arrowElement = document.createElement('div');
        arrowElement.innerHTML = arrowHTML;

        const arrowMarker = new maplibregl.Marker({
            element: arrowElement,
            anchor: 'center'
        });

        let gpsStarted = false;
        let firstFix = true;

        // GPS
        function findMe() {
            if (!navigator.geolocation) {
                document.getElementById('status').textContent =
                    'GPS: NOT SUPPORTED';
                return;
            }

            document.getElementById('status').textContent =
                'GPS: SEARCHING...';

            if (gpsStarted) return;

            gpsStarted = true;

            navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = Math.round(position.coords.accuracy);

                    document.getElementById('status').textContent =
                        'GPS: CONNECTED / ACCURACY: ' + accuracy + ' M';

                    document.getElementById('coordinates').textContent =
                        'COORDINATES: ' +
                        lat.toFixed(6) + ', ' + lon.toFixed(6);

                    arrowMarker
                        .setLngLat([lon, lat])
                        .addTo(map);

                    if (firstFix) {
                        map.flyTo({
                            center: [lon, lat],
                            zoom: 16,
                            speed: 1.2
                        });

                        firstFix = false;
                    }
                },

                function(error) {
                    gpsStarted = false;

                    const messages = {
                        1: 'GPS: PERMISSION DENIED',
                        2: 'GPS: POSITION UNAVAILABLE',
                        3: 'GPS: TIMEOUT'
                    };

                    document.getElementById('status').textContent =
                        messages[error.code] || 'GPS ERROR';
                },

                {
                    enableHighAccuracy: true,
                    maximumAge: 3000,
                    timeout: 15000
                }
            );
        }

        // PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .catch(function(error) {
                        console.error('Service Worker error:', error);
                    });
            });
        }
    </script>
</body>
</html>
