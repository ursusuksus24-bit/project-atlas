<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0a20">
    <meta name="description" content="Project Atlas — интерактивная карта реального мира.">
    <title>Project Atlas</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0a20;
            font-family: Arial, sans-serif;
        }

        #map {
            position: absolute;
            inset: 0;
            background: #0b0a20;
        }

        .top-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .logo {
            color: #f5efff;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 14px rgba(255, 70, 160, .5);
        }

        .subtitle {
            margin-top: 5px;
            color: #55e6e8;
            font-size: 10px;
            letter-spacing: 3px;
        }

        .gps-button {
            position: absolute;
            right: 20px;
            bottom: 105px;
            z-index: 10;
            padding: 14px 20px;
            border: 1px solid #ff69bd;
            border-radius: 6px;
            background: rgba(12, 10, 29, .96);
            color: #ff9bd7;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 70, 160, .2);
        }

        .gps-button:active {
            background: #35203f;
        }

        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            min-height: 75px;
            padding: 15px 20px;
            z-index: 10;
            background: rgba(10, 9, 27, .97);
            border-top: 1px solid rgba(255, 90, 180, .5);
            color: white;
        }

        .bottom-title {
            margin-bottom: 7px;
            color: #ff80c9;
            font-size: 10px;
            letter-spacing: 3px;
        }

        .bottom-info {
            color: #d2c9e7;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .user-arrow {
            width: 48px;
            height: 58px;
            filter:
                drop-shadow(0 0 2px #080b18)
                drop-shadow(0 0 5px #ffffff)
                drop-shadow(0 0 10px rgba(70, 235, 235, .8));
        }

        .maplibregl-ctrl-attrib {
            font-size: 10px !important;
        }

        @media (max-width: 600px) {
            .top-panel {
                top: 16px;
                left: 15px;
            }

            .logo { font-size: 19px; }

            .gps-button {
                right: 15px;
                bottom: 100px;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="top-panel">
        <div class="logo">PROJECT ATLAS</div>
        <div class="subtitle">VICE CITY / NIGHTCALL</div>
    </div>

    <button class="gps-button" onclick="findMe()">
        ◉ НАЙТИ МЕНЯ
    </button>

    <div class="bottom-panel">
        <div class="bottom-title">GPS SYSTEM</div>
        <div class="bottom-info" id="status">LOCATION: TASHKENT</div>
        <div class="bottom-info" id="coordinates">COORDINATES: WAITING...</div>
    </div>

    <script>
        // Создание карты
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/dark',

            // Начальный обзор региона Ташкент — Чарвак
            center: [69.585, 41.465],
            zoom: 9.2,

            attributionControl: true,
            pitchWithRotate: false,
            dragRotate: false
        });

        // Палитра Vice City / Project Atlas
        function applyAtlasStyle() {
            const layers = map.getStyle().layers || [];

            layers.forEach(layer => {
                const id = layer.id.toLowerCase();
                const sourceLayer =
                    (layer['source-layer'] || '').toLowerCase();

                try {
                    // Фон
                    if (layer.type === 'background') {
                        map.setPaintProperty(
                            layer.id,
                            'background-color',
                            '#100d25'
                        );
                    }

                    // Вода
                    if (
                        layer.type === 'fill' &&
                        (sourceLayer === 'water' || id.includes('water'))
                    ) {
                        map.setPaintProperty(
                            layer.id,
                            'fill-color',
                            '#111936'
                        );
                    }

                    // Зелёные зоны и парки
                    if (
                        layer.type === 'fill' &&
                        ['park', 'landcover', 'landuse'].includes(sourceLayer)
                    ) {
                        map.setPaintProperty(
                            layer.id,
                            'fill-color',
                            '#17152d'
                        );
                    }

                    // Здания и кварталы
                    if (
                        layer.type === 'fill' &&
                        (
                            sourceLayer === 'building' ||
                            id.includes('building')
                        )
                    ) {
                        map.setPaintProperty(
                            layer.id,
                            'fill-color',
                            '#211832'
                        );

                        map.setPaintProperty(
                            layer.id,
                            'fill-outline-color',
                            '#493052'
                        );
                    }

                    // Дорожная сеть
                    if (
                        layer.type === 'line' &&
                        sourceLayer === 'transportation'
                    ) {
                        const isCasing = id.includes('casing');

                        const roadColors = [
                            'match',
                            ['get', 'class'],
                            'motorway', '#ff55b5',
                            'trunk', '#f65aaf',
                            'primary', '#ed4da7',
                            'secondary', '#d85ba9',
                            'tertiary', '#48bfc9',
                            'minor', '#348d9f',
                            'service', '#376a86',
                            'path', '#354d75',
                            'track', '#354d75',
                            '#47718d'
                        ];

                        const casingColors = [
                            'match',
                            ['get', 'class'],
                            'motorway', '#64234f',
                            'trunk', '#572449',
                            'primary', '#512044',
                            'secondary', '#462044',
                            'tertiary', '#193d50',
                            '#192b47'
                        ];

                        map.setPaintProperty(
                            layer.id,
                            'line-color',
                            isCasing ? casingColors : roadColors
                        );

                        // Мягкое свечение крупных дорог
                        if (!isCasing) {
                            map.setPaintProperty(
                                layer.id,
                                'line-blur',
                                [
                                    'interpolate',
                                    ['linear'],
                                    ['zoom'],
                                    10, 0,
                                    15, 0.8,
                                    18, 1.2
                                ]
                            );
                        }
                    }

                    // Названия улиц и объектов
                    if (layer.type === 'symbol') {
                        if (
                            map.getPaintProperty(layer.id, 'text-color') !== undefined
                        ) {
                            map.setPaintProperty(
                                layer.id,
                                'text-color',
                                '#d8c9ed'
                            );
                        }

                        if (
                            map.getPaintProperty(layer.id, 'text-halo-color') !== undefined
                        ) {
                            map.setPaintProperty(
                                layer.id,
                                'text-halo-color',
                                '#100d25'
                            );
                        }

                        if (
                            map.getPaintProperty(layer.id, 'text-halo-width') !== undefined
                        ) {
                            map.setPaintProperty(
                                layer.id,
                                'text-halo-width',
                                1.3
                            );
                        }
                    }
                } catch (error) {
                    console.warn('Style layer skipped:', layer.id, error);
                }
            });
        }

        map.on('load', applyAtlasStyle);

        // Стрелка GPS
        const arrowHTML = `
            <svg class="user-arrow" viewBox="0 0 48 58"
                 xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="arrowTop" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="45%" stop-color="#8cfff5"/>
                        <stop offset="100%" stop-color="#28cbd2"/>
                    </linearGradient>

                    <linearGradient id="arrowSide" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#172536"/>
                        <stop offset="100%" stop-color="#526477"/>
                    </linearGradient>
                </defs>

                <path d="M24 3 L44 27 L24 55 L4 27 Z"
                      fill="#101827"
                      stroke="#ffffff"
                      stroke-width="2"/>

                <path d="M24 3 L24 55 L4 27 Z"
                      fill="url(#arrowSide)"/>

                <path d="M24 3 L42 26 L24 43 L6 26 Z"
                      fill="url(#arrowTop)"
                      stroke="#ffffff"
                      stroke-width="1.2"/>

                <path d="M18 49 L24 55 L30 49"
                      fill="none"
                      stroke="#ff62b9"
                      stroke-width="2.5"
                      stroke-linecap="round"/>
            </svg>
        `;

        const arrowElement = document.createElement('div');
        arrowElement.innerHTML = arrowHTML;

        const arrowMarker = new maplibregl.Marker({
            element: arrowElement,
            anchor: 'center'
        });

        let gpsStarted = false;
        let firstFix = true;

        // GPS
        function findMe() {
            if (!navigator.geolocation) {
                document.getElementById('status').textContent =
                    'GPS: NOT SUPPORTED';
                return;
            }

            document.getElementById('status').textContent =
                'GPS: SEARCHING...';

            if (gpsStarted) return;

            gpsStarted = true;

            navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = Math.round(position.coords.accuracy);

                    document.getElementById('status').textContent =
                        'GPS: CONNECTED / ACCURACY: ' + accuracy + ' M';

                    document.getElementById('coordinates').textContent =
                        'COORDINATES: ' +
                        lat.toFixed(6) + ', ' + lon.toFixed(6);

                    arrowMarker
                        .setLngLat([lon, lat])
                        .addTo(map);

                    if (firstFix) {
                        map.flyTo({
                            center: [lon, lat],
                            zoom: 16,
                            speed: 1.2
                        });

                        firstFix = false;
                    }
                },

                function(error) {
                    gpsStarted = false;

                    const messages = {
                        1: 'GPS: PERMISSION DENIED',
                        2: 'GPS: POSITION UNAVAILABLE',
                        3: 'GPS: TIMEOUT'
                    };

                    document.getElementById('status').textContent =
                        messages[error.code] || 'GPS ERROR';
                },

                {
                    enableHighAccuracy: true,
                    maximumAge: 3000,
                    timeout: 15000
                }
            );
        }

        // PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .catch(function(error) {
                        console.error('Service Worker error:', error);
                    });
            });
        }
    </script>
</body>
</html>
